apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "resilientops.fullname" . }}
  labels:
    {{- include "resilientops.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "resilientops.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "resilientops.labels" . | nindent 8 }}
    spec:
      containers:
        - name: resilientops-backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: REGION
              value: {{ .Values.region | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecretName }}
                  key: {{ .Values.database.existingSecretKey }}
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecretName }}
                  key: {{ .Values.apiKeySecretKey }}
            - name: ALLOWED_ORIGINS
              value: {{ .Values.allowedOrigins | quote }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
