# Default values for resilientops. Override per-region with
# helm upgrade --install -f values-primary.yaml / -f values-secondary.yaml.
#
# NOTE: this chart currently deploys the backend (application) tier only.
# The frontend tier (frontend/) added alongside it does not have a Helm
# template yet - see PROGRESS.md - so this is a 2-of-3 tiers deployment
# on the AKS path today. The ACI path (terraform/envs/aci-poc) deploys
# both tiers together.

image:
  repository: ""      # set to <acr-login-server>/resilientops-backend
  tag: "latest"
  pullPolicy: IfNotPresent

replicaCount: 1        # kept at 1: Standard_B2s single-node clusters have no room to spare (AD-005)

region: "unspecified"  # surfaced by /healthz - set to "westeurope" or "northeurope"

# Resource requests/limits are deliberately small - a single Standard_B2s
# node (2 vCPU / 4 GiB) also has to run system pods (kube-proxy, CoreDNS,
# CNI, metrics-server, etc.), leaving well under 2 vCPU / 4 GiB for workload
# pods. See DECISIONS.md AD-005.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

service:
  type: LoadBalancer
  port: 80
  targetPort: 8000
  # Set to the static azurerm_public_ip created by Terraform for this region
  # (terraform output primary_ingress_ip / secondary_ingress_ip), so the
  # address handed to Traffic Manager never changes across redeploys.
  loadBalancerIP: ""
  # Required alongside loadBalancerIP for AKS: the resource group the
  # public IP actually lives in (the AKS node resource group).
  resourceGroup: ""

# Database connection and the write-endpoint API key. Both values live in
# the same pre-existing Kubernetes Secret, NOT in Helm values / --set / a
# committed values file. See templates/deployment.yaml and docs/security.md.
database:
  existingSecretName: "resilientops-db-credentials"
  existingSecretKey: "database-url"

apiKeySecretKey: "api-key"  # second key in the same Secret named above

# CORS origins the frontend tier is served from. "*" is a POC convenience -
# see docs/security.md.
allowedOrigins: "*"

probes:
  livenessPath: /healthz
  readinessPath: /readyz
