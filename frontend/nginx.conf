server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # config.js is generated per-container-start (see docker-entrypoint.sh) -
    # never let a CDN/browser cache a stale API_BASE_URL.
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
