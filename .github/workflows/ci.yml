name: CI

# Runs on every push/PR. Pure validation - lint, test, build - no Azure
# credentials, no cloud resources touched. Safe to run unattended.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app-tests:
    name: Python app - lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: app-tests
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: app
          push: false
          tags: notes-api:ci

  terraform-validate:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform fmt -check
        run: terraform fmt -check -recursive terraform/

      - name: terraform init (no backend, no credentials needed)
        working-directory: terraform/envs/dr-poc
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: terraform/envs/dr-poc
        run: terraform validate

  helm-lint:
    name: Helm lint & template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "v3.16.1"

      - name: helm lint
        run: helm lint helm/notes-api

      - name: helm template (sanity render)
        run: |
          helm template ci helm/notes-api \
            --set image.repository=example.azurecr.io/notes-api \
            --set image.tag=ci
